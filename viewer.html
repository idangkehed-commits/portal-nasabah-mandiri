<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal Nasabah - Akses Lihat</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#17263b;font:14px/1.5 Arial}header{background:#12375b;color:white;padding:20px max(20px,calc((100vw - 1200px)/2));display:flex;justify-content:space-between;align-items:center;gap:15px}h1{font-size:23px;margin:0}button,input,select{font:inherit;border:1px solid #cbd5e1;border-radius:8px;padding:9px 12px;background:white;color:#17263b}button{cursor:pointer}main{max-width:1240px;margin:24px auto;padding:0 20px}.tools{display:flex;flex-wrap:wrap;gap:10px;margin:15px 0}input{flex:1;min-width:200px}.selected{background:#12375b;color:white}.table-wrap{overflow:auto;background:white;border-radius:10px}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:12px;border-bottom:1px solid #e2e8f0;vertical-align:top}th{background:#e2e8f0;white-space:nowrap}#status,#updateNotice{padding:12px;background:white;border-radius:8px;margin:12px 0}#updateNotice{background:#fef3c7}dialog{width:min(800px,95vw);max-height:85vh;border:0;border-radius:14px;padding:24px}dialog::backdrop{background:#10243caa}dl{display:grid;grid-template-columns:150px 1fr;gap:8px}dt{font-weight:bold}dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.pager{display:flex;justify-content:space-between;align-items:center;margin:15px 0}small{color:#64748b}header small{color:#dbeafe}@media print{body>*{display:none!important}body:after{content:'Akses ini hanya untuk melihat data.'}}
</style></head><body><header><div><h1>Portal Nasabah</h1><small>Akses lihat data</small></div><form method="post" action="/__access/logout"><button>Keluar</button></form></header><main><div id="updateNotice" hidden>Versi aplikasi baru tersedia. <button id="reloadApp">Muat ulang</button></div><div class="tools"><button data-tab="pipeline">Pipeline</button><button data-tab="tagihan">Tagihan</button><button data-tab="booking">Booking / Pencairan</button></div><div class="tools"><input id="search" placeholder="Cari nama, CIF, rekening, atau alamat" aria-label="Cari nasabah"><select id="credit" aria-label="Filter jenis kredit"><option value="">Semua jenis kredit</option><option>KUR</option><option>KUM</option><option>KSM</option><option>KTA</option></select></div><div id="status" role="status">Memuat database bersama...</div><div class="table-wrap"><table><thead><tr><th>Nama nasabah</th><th>CIF</th><th>Produk / rekening</th><th>Alamat</th><th>Detail</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pager"><button id="prev">Sebelumnya</button><span id="pageInfo"></span><button id="next">Berikutnya</button></div><small>Data diperbarui oleh admin. Pembaruan diperiksa otomatis setiap satu menit.</small></main><dialog id="detail"><button id="closeDetail">Tutup</button><div id="detailContent"></div></dialog><script src="/viewer.js"></script></body></html>
