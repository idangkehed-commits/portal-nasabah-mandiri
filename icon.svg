<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="portalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00143D"/>
      <stop offset="45%" stop-color="#002776"/>
      <stop offset="100%" stop-color="#0054A6"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="url(#portalGrad)"/>

  <!-- Subtle grid accent -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Card Backdrop -->
  <g filter="url(#glow)">
    <rect x="80" y="110" width="352" height="292" rx="28" fill="#FFFFFF" fill-opacity="0.96"/>
  </g>

  <!-- Card Header Strip -->
  <path d="M 80 138 Q 80 110 108 110 L 404 110 Q 432 110 432 138 L 432 180 L 80 180 Z" fill="#002776"/>

  <!-- Gold Star / Badge ("Kawan Lama / VIP") -->
  <circle cx="380" cy="145" r="22" fill="url(#goldGrad)"/>
  <path d="M 380 132 L 384 141 L 394 142 L 386 148 L 389 158 L 380 152 L 371 158 L 374 148 L 366 142 L 376 141 Z" fill="#FFFFFF"/>

  <!-- Card title text shapes -->
  <rect x="110" y="135" width="140" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.9"/>
  <rect x="110" y="155" width="80" height="8" rx="4" fill="#FFB703"/>

  <!-- Search / Magnifier Circle -->
  <circle cx="160" cy="250" r="32" fill="#EBF4FF" stroke="#0054A6" stroke-width="8"/>
  <line x1="184" y1="274" x2="210" y2="300" stroke="#0054A6" stroke-width="8" stroke-linecap="round"/>

  <!-- Checkmark inside search -->
  <path d="M 148 250 L 156 258 L 172 242" fill="none" stroke="#10B981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Info lines (Nama, Produk, Limit) -->
  <rect x="230" y="230" width="160" height="14" rx="7" fill="#1E293B"/>
  <rect x="230" y="254" width="110" height="12" rx="6" fill="#0054A6"/>
  <rect x="230" y="276" width="140" height="16" rx="8" fill="#10B981"/>

  <!-- Currency / Limit Pill at bottom of card -->
  <rect x="110" y="335" width="292" height="42" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <circle cx="140" cy="356" r="12" fill="url(#goldGrad)"/>
  <text x="135" y="361" font-family="sans-serif" font-size="12" font-weight="bold" fill="#002776">Rp</text>
  <rect x="165" y="348" width="120" height="14" rx="7" fill="#002776"/>
  <rect x="330" y="346" width="56" height="18" rx="9" fill="#10B981"/>
</svg>
