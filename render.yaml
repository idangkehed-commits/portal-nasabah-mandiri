services:
  - type: web
    name: portal-nasabah-kredit
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: ACCESS_TOTP_SECRET
        sync: false

  - type: web
    name: portal-nasabah-mandiri
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: ACCESS_TOTP_SECRET
        fromService:
          name: portal-nasabah-kredit
          type: web
          envVarKey: ACCESS_TOTP_SECRET
